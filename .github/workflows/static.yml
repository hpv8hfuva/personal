name: Deploy Blog

on:
  push:
    branches: [ main, master ]  # Trigger on push to main or master branch
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        working-directory: ./blog 
        run: npm ci
        
      - name: Build
        working-directory: ./blog 
        run: npm run build
        env:
          CI: false  # This prevents the build from failing on warnings
          PUBLIC_URL: "."  # Makes assets load correctly on GitHub Pages
          
      - name: Configure for GitHub Pages
        run: |
          # Create a .nojekyll file to prevent GitHub Pages from ignoring files that begin with an underscore
          touch build/.nojekyll
          # If using React Router, create a 404.html that redirects to index.html
          cp build/index.html build/404.html
          
          # Create a simple script to handle GitHub Pages routing with React Router
          cat > build/404.html << EOL
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Redirecting...</title>
              <script>
                // Single-page app routing for GitHub Pages
                // https://github.com/rafgraph/spa-github-pages
                var pathSegmentsToKeep = 1;
                var l = window.location;
                l.replace(
                  l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                  l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
                  l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
                  (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                  l.hash
                );
              </script>
            </head>
            <body>
              Redirecting...
            </body>
          </html>
          EOL
          
          # Update the index.html to handle the redirect
          sed -i '/<head>/a \
          <script>\
            (function() {\
              var redirect = sessionStorage.redirect;\
              delete sessionStorage.redirect;\
              if (redirect && redirect !== location.href) {\
                history.replaceState(null, null, redirect);\
              }\
            })();\
          </script>' build/index.html
          
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build  # The folder the action should deploy
          branch: gh-pages  # The branch the action should deploy to